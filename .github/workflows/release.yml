name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE_NOTES_0.1.0.md
          files: |
            dist/*.whl
            dist/*.tar.gz

