[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ricehullcolor"
version = "0.1.0"
description = "Reproducible CIELAB, sRGB and grayscale phenotyping for rice hull images"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Cryst4al"}]
keywords = ["rice", "phenotyping", "CIELAB", "image-analysis", "ImageJ"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
tiff = ["tifffile>=2024.1", "imagecodecs>=2024.1"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.6"]

[project.scripts]
ricehullcolor = "ricehullcolor.cli:main"
ricehullcolor-gui = "ricehullcolor.gui:main"

[project.urls]
Documentation = "https://github.com/Cryst4al/RiceHullColor#readme"
Issues = "https://github.com/Cryst4al/RiceHullColor/issues"
Source = "https://github.com/Cryst4al/RiceHullColor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ricehullcolor = ["resources/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
